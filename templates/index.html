<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Plant Disease Detection</h1>
        <p class="text-center">Upload an image of a plant leaf to detect diseases</p>
        <form id="upload-form" enctype="multipart/form-data" class="mt-4">
            <div class="form-group">
                <input type="file" id="file-input" name="file" accept="image/*" required class="form-control-file">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Upload and Predict</button>
        </form>
        <div id="loading" class="mt-4 text-center d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <div id="result" class="mt-4 text-center"></div>
        <div id="image-preview" class="mt-4 text-center"></div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
